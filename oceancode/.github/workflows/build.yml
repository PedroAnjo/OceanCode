
name: Compilar OceanCode - Windows e Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: OceanCode - ${{ matrix.nome }}
    runs-on: ${{ matrix.sistema }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: windows-latest
            nome: Windows
            artefato: OceanCode-Windows
            executavel: dist/OceanCode.exe

          - sistema: ubuntu-22.04
            nome: Linux
            artefato: OceanCode-Linux
            executavel: dist/OceanCode

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v7

      - name: Configurar Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6,<7"

      - name: Preparar icone Windows
        if: runner.os == 'Windows'
        run: |
          python -m pip install Pillow
          python -c "from PIL import Image; Image.open('oceancode/assets/images/icone.png').convert('RGBA').save('oceancode/assets/images/icone.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Gerar executavel
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name OceanCode
          --icon "${{ runner.os == 'Windows' && 'oceancode/assets/images/icone.ico' || 'NONE' }}"
          --add-data "oceancode/assets:oceancode/assets"
          main.py

      - name: Disponibilizar executavel
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artefato }}
          path: ${{ matrix.executavel }}
          if-no-files-found: error
          retention-days: 30
