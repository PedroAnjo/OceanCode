name: Compilar OceanCode - Windows e Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: OceanCode - ${{ matrix.nome }}
    runs-on: ${{ matrix.sistema }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: windows-latest
            nome: Windows
            artefato: OceanCode-Windows
            executavel: dist/OceanCode.exe

          - sistema: ubuntu-22.04
            nome: Linux
            artefato: OceanCode-Linux
            executavel: dist/OceanCode

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v7

      - name: Configurar Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6,<7"

      - name: Gerar executavel Windows
        if: runner.os == 'Windows'
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name OceanCode
          --icon "oceancode/assets/images/logo.ico"
          --add-data "oceancode/assets:oceancode/assets"
          main.py

      - name: Gerar executavel Linux
        if: runner.os == 'Linux'
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name OceanCode
          --add-data "oceancode/assets:oceancode/assets"
          main.py

      - name: Disponibilizar executavel
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artefato }}
          path: ${{ matrix.executavel }}
          if-no-files-found: error
          retention-days: 30